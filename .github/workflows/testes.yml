
name: Testes automatizados

on:
  push:
    branches: [main, review/melhorias-mvp]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Inicializar banco de dados
        run: python -m data.database

      - name: Executar testes e cobertura
        run: |
          python -m pytest tests/test_app.py -v --cov=app --cov=business --cov=data --cov-report=term
