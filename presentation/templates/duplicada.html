<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nota já cadastrada - Conferência Fácil</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f5f8;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            width: 90%;
            max-width: 450px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            color: #174a83;
        }

        .alerta {
            background-color: #fff3cd;
            border: 1px solid #e5c56b;
            padding: 15px;
            border-radius: 5px;
            margin: 25px 0;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            background-color: #174a83;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Conferência Fácil</h1>

        <div class="alerta" role="alert">
            <strong>Nota fiscal já cadastrada!</strong>

            <p>
                Esta nota fiscal já foi importada anteriormente.
                Nenhum novo registro foi criado.
            </p>
        </div>

        <a href="/importacao">Voltar para importação</a>
    </main>
</body>
</html>
