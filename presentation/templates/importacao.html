<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar nota fiscal - Conferência Fácil</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f5f8;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            width: 90%;
            max-width: 500px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #174a83;
            text-align: center;
        }

        p {
            color: #555;
            text-align: center;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background-color: #174a83;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #174a83;
        }

.spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 3px solid rgba(255, 255, 255, 0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: girar 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
}

@keyframes girar {
    to {
        transform: rotate(360deg);
    }
}

button:disabled {
    opacity: 0.8;
    cursor: wait;
}

.navegacao {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.navegacao a {
    margin-top: 0;
}
    </style>
</head>

<body>
    <main class="container">
        <h1>Importar nota fiscal</h1>

        <p>
            Selecione o arquivo XML da nota fiscal
            para iniciar a conferência dos produtos.
        </p>

        <form action="/resultado" method="POST" enctype="multipart/form-data"
              onsubmit="mostrarCarregamento(event)">

          <label for="arquivo">Arquivo XML</label>

          <input
                type="file"
                id="arquivo"
                name="arquivo"
                accept=".xml"
                required
            >

            <button type="submit" id="btnProcessar">
    <span class="spinner" id="spinner"></span>
    <span id="textoBotao">Processar nota</span>
</button>
        </form>

        <div class="navegacao">
    <a href="/historico">Histórico de importações</a>
    <a href="/">Voltar</a>
</div>
    </main>

<script>
    let enviando = false;

    function mostrarCarregamento(evento) {
        evento.preventDefault();

        if (enviando) {
            return;
        }

        enviando = true;

        const formulario = evento.target;
        const botao = document.getElementById("btnProcessar");
        const spinner = document.getElementById("spinner");
        const texto = document.getElementById("textoBotao");

        spinner.style.display = "inline-block";
        texto.textContent = "Processando nota...";
        botao.disabled = true;

        setTimeout(function() {
            formulario.submit();
        }, 1000);
    }
</script>
</body>
</html>
